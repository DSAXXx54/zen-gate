name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          go build -trimpath -ldflags "-s -w -H=windowsgui -X zen-gate/internal/gateway.Version=$ver -X zen-gate/internal/update.Current=$ver" -o dist/zen-gate.exe ./cmd/zen-gate
          go build -trimpath -ldflags "-s -w" -o dist/zenstats.exe ./cmd/zenstats

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Compress-Archive -Path dist/zen-gate.exe, dist/README.md -DestinationPath dist/zen-gate-$("${{ github.ref_name }}" -replace '^v','').zip -Force

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/zen-gate.exe dist/zenstats.exe dist/*.zip --title "${{ github.ref_name }}" --generate-notes --latest
