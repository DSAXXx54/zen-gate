name: release

on:
  push:
    tags: ["v*"]
  # PRs get the build gate too, so a change to the shared Go code is proven on
  # both platforms before it lands. Releases still only happen on tags: the
  # publish step below is gated on the ref, and a fork PR's token is read-only.
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "assets/**"
      - "tools/build-macos.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          go build -trimpath -ldflags "-s -w -H=windowsgui -X zen-gate/internal/gateway.Version=$ver -X zen-gate/internal/update.Current=$ver" -o dist/zen-gate.exe ./cmd/zen-gate
          go build -trimpath -ldflags "-s -w" -o dist/zenstats.exe ./cmd/zenstats

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          Copy-Item README.md dist/README.md
          if (-not (Test-Path dist/zen-gate.exe)) { throw "zen-gate.exe missing" }
          tar -a -c -f "dist/zen-gate-$ver.zip" -C dist zen-gate.exe README.md
          Get-ChildItem dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/zen-gate.exe dist/zenstats.exe dist/*.zip --title "${{ github.ref_name }}" --generate-notes --latest
